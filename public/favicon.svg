<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="tile-ambient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Tile Border -->
  <rect width="64" height="64" rx="16" fill="url(#tile-border)" />

  <!-- Inner Dark Obsidian Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile-ambient)" />

  <!-- Left Facet: Vibrant Mint Teal -->
