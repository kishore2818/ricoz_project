<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pe-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" flood-color="#0F172A" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect width="64" height="64" rx="16" fill="url(#pe-gradient)" filter="url(#shadow)"/>
  
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Trend / Performance Line & Node Accent -->
  <path d="M14 44 L26 34 L36 40 L50 20" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <circle cx="50" cy="20" r="3" fill="#38BDF8" opacity="0.8" />

  <!-- Apex Institutional Monogram (AP) -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    AP
  </text>
</svg>

